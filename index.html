<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripMemo · 人生记忆地图</title>
  <!-- 给样式表加版本号，防止浏览器拿旧的缓存（改了 CSS 后把 v 的数字 +1 即可） -->
  <link rel="stylesheet" href="css/style.css?v=43">
</head>
<body>

  <!-- ===== 左侧导航栏：切换视图 + 导出 =====
       宽屏（≥768px）时是贴着左边的竖条，窄屏时自动变回顶部横条。
       两种形态共用同一份 HTML，靠 CSS 媒体查询切换方向。 -->
  <nav class="app-nav">
    <!-- ⭐ 站点标题**同时是「回门面页」的入口**（Day 11 重做补）
        以前门面页是"有进无出"：进去之后没有任何入口能回来，只能刷新页面。

        为什么用标题当入口、而不是在导航里再加一个「首页」按钮：
          ① 门面页**不在导航体系里** —— 它是"封面"，不是"视图"
             （上一版就是这么定的，见下面 nav-items 的注释）；
          ② 网站标题本身就是"回家"的惯例位置；
          ③ 不往导航栏多塞一项。

        ⚠️ 它**必须是真的 `<button>`**，不能只在 `<h1>` 上挂个 click ——
           只有真按钮才能被 Tab 走到、能按回车/空格触发，
           也才吃得到全站那条 `:focus-visible` 规则。 -->
    <h1 class="app-title">
      <button type="button" class="app-home" id="nav-home">TripMemo</button>
    </h1>

    <div class="nav-items">
      <!-- ⚠️ Day 11：这里**不再预置 `is-active`** —— 默认首屏改成门面页了，
           门面页不在导航里，所以进来时导航应是"一个都没选中"。
           （以前写死在地图上，会出现"门面页显示着、导航却高亮地图"的错位。） -->
      <button type="button" class="nav-btn" data-view="map">
        <span class="nav-icon" aria-hidden="true">🗺</span>
        <span class="nav-label">地图</span>
      </button>
      <button type="button" class="nav-btn" data-view="timeline">
        <span class="nav-icon" aria-hidden="true">📅</span>
        <span class="nav-label">时间轴</span>
      </button>
      <button type="button" class="nav-btn" data-view="places">
        <span class="nav-icon" aria-hidden="true">📍</span>
        <span class="nav-label">地点列表</span>
      </button>
    </div>

    <button type="button" class="nav-btn nav-btn--action" id="btn-sample">
      <span class="nav-icon" aria-hidden="true">✨</span>
      <span class="nav-label" id="btn-sample-label">载入示例数据</span>
    </button>

      <!-- 导入：给「导出 JSON」补上"回程"（Day 11 重做补）
           ⚠️ 以前只有导出、没有导入 —— 导出的文件等于死在硬盘上回不来，
              「数据全丢」这个风险其实一直没被真正兜住。 -->
      <button type="button" class="nav-btn nav-btn--action" id="btn-import">
        <span class="nav-icon" aria-hidden="true">⬆</span>
        <span class="nav-label">导入 JSON</span>
      </button>

      <button type="button" class="nav-btn nav-btn--action" id="btn-export">
        <span class="nav-icon" aria-hidden="true">⬇</span>
        <span class="nav-label">导出 JSON</span>
      </button>

      <!-- 隐藏的文件选择器，由上面的「导入 JSON」按钮转手触发。
           ⚠️ 用 hidden（display:none）**不影响键盘可用性** ——
              真正要能被键盘操作的，是那个真按钮；这里只是它去点的对象。
           ⚠️ accept 只是给系统文件对话框的提示，**不是安全边界**（用户可以选"所有文件"）——
              真正的把关在 store.js 的 importJSON 里（校验 app 标记）。 -->
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </nav>

  <!-- ===== 主区：视图 + 弹窗 ===== -->
  <div class="app-body">

  <!-- 数据层出错时的全局提示条（Day 8）
       ⚠️ 为什么需要它：数据层原来出错只写 console.error，
          用户看到的是一片空白，完全不知道发生了什么。
          错误状态是"最容易被忽略"的一种页面状态 —— 本地开发时
          它永远不会自己出现，所以最容易漏掉。 -->
  <div class="app-alert" id="app-alert" hidden></div>

  <main class="app-main">

    <!-- ===== 视图 0：门面页（Day 11 新增）=====
         访客看到的第一屏 —— **不是功能页**，是"这是什么"的自我介绍。
         点「开始记录」进入地图视图。

         结构与参考站（html5up.net/dimension）一致：
           全屏背景 + 一圈内缩细描边 → 圆形徽标 + 竖线 → 大标题
           → 横线 → 一行小字 → 横线 → 一个按钮 → 底部一行小字

         ⚠️ 这一屏**不显示左侧导航**（靠 body.is-landing 控制）。
            门面就该是整屏一屏，露出一排功能菜单就不像门面了。
         ⚠️ 它没有"返回入口"：它是**门**，不是视图之一。
            想再看一次刷新页面即可。 -->
    <section class="view is-active" id="view-landing">
      <div class="landing">

        <!-- 徽标：**把地图上那张图抽象出来** ——
             一个实心点（主城市锚点）+ 三条弧线放射出去，弧线**越短越细**
             （呼应"线宽 ∝ 停留时长"这条产品主视觉）。
             ⚠️ 用内联 SVG 而不是图片文件：**不增加任何项目资产**，
                而且能跟着 CSS 的 color 走（换主题色不用重画）。
             ⚠️ 口径统一：三条弧的 `stroke-width` 递减 = 时长递减，
                所以最细那条别细到看不见（下面是 2.2 / 1.7 / 1.2）。 -->
        <div class="landing-mark" aria-hidden="true">
          <svg class="landing-mark-svg" viewBox="0 0 48 48" focusable="false"
               fill="none" stroke="currentColor" stroke-linecap="round">
            <!-- 三条弧：从锚点放射出去 -->
            <path d="M13 36 Q 20 13 37 11" stroke-width="2.2"></path>
            <path d="M13 36 Q 25 21 39 24" stroke-width="1.7"></path>
            <path d="M13 36 Q 25 28 37 35" stroke-width="1.2"></path>
            <!-- 终点：越远的越大（对应地图上"停得越久的点越大"） -->
            <circle cx="37" cy="11" r="2.7" fill="currentColor" stroke="none"></circle>
            <circle cx="39" cy="24" r="2.1" fill="currentColor" stroke="none"></circle>
            <circle cx="37" cy="35" r="1.5" fill="currentColor" stroke="none"></circle>
            <!-- 锚点最后画，压在三条弧的起点上，视觉上"从这里出发" -->
            <circle cx="13" cy="36" r="4.2" fill="currentColor" stroke="none"></circle>
          </svg>
        </div>

        <h1 class="landing-title">TripMemo</h1>

        <hr class="landing-rule">

        <p class="landing-sub">记录足迹，珍藏每一段在路上的故事</p>

        <hr class="landing-rule">

        <button type="button" class="landing-cta" id="landing-enter">开始记录</button>

        <p class="landing-foot">数据存在你自己的浏览器里，不上传任何服务器。</p>
      </div>
    </section>

    <!-- 视图 1：地图（Day 11 起**不再是**默认首屏，改由门面页开门） -->
    <section class="view" id="view-map">
      <!-- 左上角工具条：搜索选点 + 类型筛选 -->
      <div class="map-toolbar">
        <!-- 搜索选点（PRD 4.1 #1 的第二种方式）：
             输入地名 → 从下拉里选一个 → 自动定位到正确坐标。
             下拉是我们自己画的（不依赖高德自带面板），方便统一风格。 -->
        <!-- ⚠️ 无障碍（Day 9）：搜索框 + 自绘下拉，是标准的 combobox 模式。
             这几个 aria 属性让读屏知道"这是一个可选列表、现在选到第几条"。
             ⚠️ 属性本身不会自动更新，必须和 js/map.js 里的 syncActive() 配合。 -->
        <div class="search-wrap">
          <input type="text" class="map-search" id="map-search-input"
                 placeholder="搜索地点，例如：华中科技大学" autocomplete="off"
                 role="combobox" aria-autocomplete="list"
                 aria-expanded="false" aria-controls="search-dropdown"
                 aria-label="搜索地点">
          <ul class="search-dropdown" id="search-dropdown" role="listbox"
              aria-label="搜索结果" hidden></ul>
        </div>

        <!-- 主城市（人生锚点）：连线都从这里出发（PRD 4.1 #8） -->
        <div class="map-maincity">
          <input type="text" class="map-search map-search--small" id="main-city-input"
                 placeholder="主城市（如：武汉）" autocomplete="off">
          <button type="button" class="mini-btn" id="main-city-set">设定</button>
          <button type="button" class="mini-btn" id="main-city-clear">清除</button>
        </div>

        <!-- 类型筛选栏：全部 / 长期居住 / 短期停留 / 旅游 / 想去 -->
        <div class="map-filter" id="map-filter"></div>
      </div>

      <!-- 地图画布：由高德渲染 -->
      <div class="map-canvas" id="map-canvas"></div>

      <!-- 新点"落位"涟漪的容器（Day 11 重做）
           ⚠️ 它和 .map-canvas **完全重合**（都是 inset:0），所以两者共用同一套像素坐标 ——
              高德 lngLatToContainer() 算出来的位置可以直接拿来用，不用再换算。
           ⚠️ 必须 pointer-events:none（铺满容器的浮层不让出点击 = 地图就点不动了）。
           ⚠️ 放在 map-canvas **之后**、map-tooltip **之前** —— 靠 DOM 顺序 + z-index 压在地图上、又不盖住悬停提示。 -->
      <div class="map-ripple-layer" id="map-ripple-layer" aria-hidden="true"></div>

      <!-- 悬停提示：鼠标停在地点上时，跟着显示地点名与停留时长 -->
      <div class="map-tooltip" id="map-tooltip" hidden></div>

      <!-- 【状态 1：加载中】地图 SDK 正在下载时显示
           为什么必须有：地图要联网下载高德 SDK，这段时间画布是全白的，
                       用户会以为"页面坏了"。给一句话，就知道是在等。 -->
      <div class="view-state" id="map-loading">
        <span class="view-state-spinner" aria-hidden="true"></span>
        <p>地图加载中……</p>
      </div>

      <!-- 【状态 2：错误】地图加载失败时显示（断网 / Key 不对 / 额度用完）
           为什么要和"空状态"分开：两者长得像，但意思完全不同 ——
           空状态是"你还没记东西"（用户自己能解决），
           错误是"环境出问题了"（用户解决不了，需要知道原因）。
           以前这里复用空状态元素，等于把错误伪装成"没数据"，已改掉。 -->
      <div class="view-state view-state--error" id="map-error" hidden>
        <p class="view-state-title">地图没能加载</p>
        <p class="view-state-msg" id="map-error-msg"></p>
        <p class="view-state-hint">
          常见原因：① 网络断了　② 高德 Key 填错或类型不是「Web端（JS API）」
          　③ 域名白名单拦住了。按 F12 看 Console 有更详细的原因。
        </p>
      </div>

      <!-- 【状态 3：空】一个地点都没有时显示（有地点后由 JS 隐藏） -->
      <div class="view-empty view-empty--overlay" id="map-empty">
        <p>还没有记录。点地图上任意位置，开始记下第一个地方。</p>
      </div>
    </section>

    <!-- 视图 2：时间轴 -->
    <section class="view" id="view-timeline">
      <!-- 卡片列表：由 js/timeline.js 渲染 -->
      <div class="panel" id="timeline-list" hidden></div>

      <!-- 空状态：一个地点都没有时显示 -->
      <div class="view-empty" id="timeline-empty">
        <p>还没有记录。先去地图上添加一个地点。</p>
      </div>
    </section>

    <!-- 视图 3：地点列表 -->
    <section class="view" id="view-places">
      <!-- 按城市分组的列表：由 js/places.js 渲染 -->
      <div class="panel" id="places-list" hidden></div>

      <!-- 空状态 -->
      <div class="view-empty" id="places-empty">
        <p>还没有记录。先去地图上添加一个地点。</p>
      </div>
    </section>

  </main>
  </div>

  <!-- ===== 地点详情抽屉（Day 10 新增 · 骨架版）=====
       点「地点列表」里的某个地点 → 从右侧铺开这个抽屉，左侧留一条变暗的底。
       规则（Day 10 由 shy 定）：
         · 粒度 = **地点**（不是城市）
         · **只读** —— 要改内容，点底部的按钮回到原来那个三态弹窗（PRD 5.4）
         · 尺寸/结构参考图：**铺满大半屏、左侧留一条暗底**（约 14%）
       ⚠️ 骨架版**暂不做照片相关的区域** —— 照片上传排在 Day 8–28（见 PRD 4.3），
          现在做只能是一屏空占位框。「照片」标签页里写明了这一点，不是忘了做。 -->
  <div class="drawer" id="drawer-place" hidden>

    <!-- 左侧那条「暗底」：同时充当遮罩，点它就关掉 -->
    <div class="drawer-scrim" id="drawer-scrim"></div>

    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">

      <!-- 主视觉区：参考图这里是照片，我们还没有照片功能 → 用主题色晕染占位 -->
      <div class="drawer-hero">
        <button type="button" class="drawer-back" id="drawer-close" aria-label="返回">←</button>
        <div class="drawer-hero-text">
          <p class="drawer-kicker" id="drawer-kicker"></p>
          <h2 class="drawer-title" id="drawer-title"></h2>
          <p class="drawer-sub" id="drawer-sub"></p>
        </div>
      </div>

      <!-- 一条只读信息（三格，对应参考图那条统计行） -->
      <dl class="drawer-stats" id="drawer-stats"></dl>

      <!-- 标签页：故事 / 时间轴 / 照片 -->
      <div class="drawer-tabs" role="tablist" id="drawer-tabs"></div>

      <!-- 内容区：跟着标签页换 -->
      <div class="drawer-body" id="drawer-body"></div>

      <div class="drawer-foot">
        <button type="button" class="btn" id="drawer-edit">编辑这个地点</button>
      </div>
    </div>
  </div>

  <!-- ===== 地点详情弹窗：三种形态 =====
         查看态（默认，只读）
         编辑态（点「编辑」进入）
         新增态（点地图空白处进入）
       三态共用同一个弹窗，只是显示的内容和按钮不同。 -->
  <div class="modal" id="modal-detail" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">

      <div class="modal-head">
        <h2 class="modal-title" id="modal-title">地点详情</h2>
        <button type="button" class="modal-close" id="modal-close" aria-label="关闭">×</button>
      </div>

      <!-- 查看态：只读陈列 -->
      <div class="modal-body" id="modal-view">
        <dl class="detail-list" id="detail-list"></dl>
      </div>

      <!-- 编辑态 / 新增态：表单 -->
      <form class="modal-body" id="modal-form" hidden>
        <label class="field">
          <span class="field-label">地点名称 <em>*</em></span>
          <input type="text" id="f-name" autocomplete="off">
        </label>

        <label class="field">
          <span class="field-label">所属城市 <em>*</em></span>
          <input type="text" id="f-city" autocomplete="off" placeholder="例如：武汉">
        </label>

        <label class="field">
          <span class="field-label">地点类型 <em>*</em></span>
          <select id="f-type"></select>
        </label>

        <label class="field">
          <span class="field-label">停留开始时间</span>
          <input type="month" id="f-start">
        </label>

        <label class="field">
          <span class="field-label">停留结束时间（留空表示"至今"）</span>
          <input type="month" id="f-end">
        </label>

        <label class="field">
          <span class="field-label">回忆正文</span>
          <textarea id="f-note" rows="4" placeholder="在这里写下和这个地方有关的回忆……"></textarea>
        </label>

        <label class="field">
          <span class="field-label">标签（多个用逗号分隔）</span>
          <input type="text" id="f-tags" autocomplete="off" placeholder="例如：大学, 四年">
        </label>

        <!-- 校验失败时在这里提示 -->
        <p class="form-error" id="form-error" hidden></p>
      </form>

      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <!-- ===== 本地配置：含高德 Key，不提交（模板见 config.example.js）=====
       找不到 config.js 时不会报错，只是地图加载不出来，页面其余部分照常可用 -->
  <script src="config.js?v=43"
          onerror="console.warn('[TripMemo] 未找到 config.js —— 地图将无法加载。请把 config.example.js 复制为 config.js 并填入 Key 与安全密钥。')"></script>

  <!-- ===== 项目脚本：顺序不能乱 =====
       model（算法）→ mock-data（示例数据）→ store（数据）
       → detail（三态弹窗）→ drawer（只读详情抽屉）→ map / timeline / places（三个视图）→ main（入口）

       ⚠️ 每个都带 ?v= 版本号，理由和上面 css 那条一样：
          **浏览器对 .js 也会缓存**。之前只给 CSS 加了版本号，
          结果改完 JS 也可能看到旧代码，白折腾一轮排查。

       ⭐ 规则（就一句）：**改完任何 css / js，把这里和上面的数字一起 +1。**
          11 个资源共用同一个编号 —— 多下载几 KB，换"永远不用想哪个该改"，
          对学习阶段来说非常划算。 -->
  <script src="js/model.js?v=43"></script>
  <script src="js/mock-data.js?v=43"></script>
  <script src="js/store.js?v=43"></script>
  <script src="js/detail.js?v=43"></script>
  <script src="js/drawer.js?v=43"></script>
  <script src="js/map.js?v=43"></script>
  <script src="js/timeline.js?v=43"></script>
  <script src="js/places.js?v=43"></script>
  <script src="js/main.js?v=43"></script>
</body>
</html>
